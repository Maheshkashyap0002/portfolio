<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadowBank" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgBank)" />
  
  <g transform="translate(60, 50)" filter="url(#shadowBank)">
    <rect width="680" height="400" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="30" cy="30" r="5" fill="#EF4444" />
    <circle cx="46" cy="30" r="5" fill="#F59E0B" />
    <circle cx="62" cy="30" r="5" fill="#10B981" />
    <line x1="0" y1="60" x2="680" y2="60" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="340" y="35" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">secure-banking-core.internal • Ledger Engine &amp; Transfer Integrity</text>

    <!-- Top Security Metrics Bar -->
    <g transform="translate(30, 80)">
      <rect width="195" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">TXN CONCURRENCY</text>
      <text x="15" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">ACID Compliant</text>

      <rect x="215" y="0" width="195" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="230" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">ENCRYPTION PROTOCOL</text>
      <text x="230" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">bcrypt + AES-256</text>

      <rect x="430" y="0" width="190" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="445" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">SESSION DEFENSE</text>
      <text x="445" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#10B981">HttpOnly Cookies</text>
    </g>

    <!-- Transaction Flow Diagram -->
    <g transform="translate(30, 170)">
      <rect width="620" height="195" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Atomic Transfer Pipeline Workflow</text>
      
      <!-- Step 1 -->
      <g transform="translate(20, 50)">
        <rect width="125" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
        <rect width="125" height="6" rx="3" fill="#3B82F6" />
        <text x="62" y="35" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">1. Request</text>
        <text x="62" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">JWT Auth</text>
        <text x="62" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Balance &gt; Sum</text>
        <rect x="25" y="85" width="75" height="16" rx="4" fill="#EFF6FF" />
        <text x="62" y="96" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">VERIFIED</text>
      </g>

      <!-- Arrow 1 -->
      <path d="M 155 105 L 175 105" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Step 2 -->
      <g transform="translate(180, 50)">
        <rect width="125" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
        <rect width="125" height="6" rx="3" fill="#F59E0B" />
        <text x="62" y="35" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">2. Ledger Lock</text>
        <text x="62" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Row Locking</text>
        <text x="62" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Prevent Race Cond</text>
        <rect x="25" y="85" width="75" height="16" rx="4" fill="#FEF3C7" />
        <text x="62" y="96" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle">LOCKED</text>
      </g>

      <!-- Arrow 2 -->
      <path d="M 315 105 L 335 105" stroke="#94A3B8" stroke-width="2" />

      <!-- Step 3 -->
      <g transform="translate(340, 50)">
        <rect width="125" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
        <rect width="125" height="6" rx="3" fill="#10B981" />
        <text x="62" y="35" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">3. Atomic Exec</text>
        <text x="62" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Debit Source</text>
        <text x="62" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Credit Target</text>
        <rect x="25" y="85" width="75" height="16" rx="4" fill="#DCFCE7" />
        <text x="62" y="96" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#166534" text-anchor="middle">APPLIED</text>
      </g>

      <!-- Arrow 3 -->
      <path d="M 475 105 L 495 105" stroke="#94A3B8" stroke-width="2" />

      <!-- Step 4 -->
      <g transform="translate(500, 50)">
        <rect width="105" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
        <rect width="105" height="6" rx="3" fill="#8B5CF6" />
        <text x="52" y="35" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">4. Audit Log</text>
        <text x="52" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">SHA256 Hash</text>
        <text x="52" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Immutable</text>
        <rect x="15" y="85" width="75" height="16" rx="4" fill="#F3E8FF" />
        <text x="52" y="96" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#7C3AED" text-anchor="middle">COMMITTED</text>
      </g>
    </g>
  </g>
</svg>
