<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F3" />
      <stop offset="100%" stop-color="#EBEBEA" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D2D" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B18A" />
      <stop offset="100%" stop-color="#C68C5D" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Editorial Card Container -->
  <rect x="30" y="20" width="540" height="660" rx="36" fill="url(#avatarBg)" stroke="#E7E7E7" stroke-width="2" />
  
  <!-- Subtle pattern lines -->
  <g stroke="#E0E0DE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
    <line x1="80" y1="20" x2="80" y2="680" />
    <line x1="520" y1="20" x2="520" y2="680" />
    <line x1="30" y1="140" x2="570" y2="140" />
    <line x1="30" y1="560" x2="570" y2="560" />
  </g>

  <!-- Silhouette / Stylized Portrait -->
  <g filter="url(#softShadow)">
    <path d="M 120 700 C 120 540, 180 490, 240 480 L 360 480 C 420 490, 480 540, 480 700 Z" fill="url(#bodyGrad)" />
    <path d="M 270 480 L 300 530 L 330 480 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 285 530 L 300 620 L 315 530 Z" fill="#E7E7E7" opacity="0.3" />

    <rect x="270" y="380" width="60" height="110" rx="10" fill="url(#skinGrad)" />
    <ellipse cx="300" cy="310" rx="85" ry="110" fill="url(#skinGrad)" />
    
    <path d="M 215 280 C 210 180, 270 170, 310 170 C 360 170, 395 190, 390 280 C 375 250, 345 220, 300 220 C 250 220, 225 250, 215 280 Z" fill="#1A1A1A" />
    <path d="M 212 280 C 210 320, 215 340, 225 350 C 220 330, 222 300, 225 290 Z" fill="#1A1A1A" />
    <path d="M 388 280 C 390 320, 385 340, 375 350 C 380 330, 378 300, 375 290 Z" fill="#1A1A1A" />

    <rect x="235" y="280" width="55" height="36" rx="12" fill="none" stroke="#171717" stroke-width="4.5" />
    <rect x="310" y="280" width="55" height="36" rx="12" fill="none" stroke="#171717" stroke-width="4.5" />
    <line x1="290" y1="295" x2="310" y2="295" stroke="#171717" stroke-width="4.5" />
    <line x1="220" y1="290" x2="235" y2="295" stroke="#171717" stroke-width="3" />
    <line x1="365" y1="295" x2="380" y2="290" stroke="#171717" stroke-width="3" />
    
    <path d="M 295 320 L 298 345 L 306 345" fill="none" stroke="#B3784A" stroke-width="3" stroke-linecap="round" />
    <path d="M 280 370 Q 300 382 320 370" fill="none" stroke="#9E653B" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Editorial Badge Top-Right -->
  <g transform="translate(410, 50)">
    <rect width="130" height="34" rx="17" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.5" />
    <circle cx="18" cy="17" r="4.5" fill="#10B981" />
    <text x="32" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" letter-spacing="0.5">NIT RAIPUR</text>
  </g>

  <!-- Bottom Floating Tag -->
  <g transform="translate(60, 600)">
    <rect width="210" height="42" rx="21" fill="#171717" filter="url(#softShadow)" />
    <text x="105" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">MAHESH KUMAR • '29</text>
  </g>
</svg>
