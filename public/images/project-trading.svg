<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <filter id="shadowTrade" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgTrade)" />
  
  <g transform="translate(60, 50)" filter="url(#shadowTrade)">
    <rect width="680" height="400" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="30" cy="30" r="5" fill="#EF4444" />
    <circle cx="46" cy="30" r="5" fill="#F59E0B" />
    <circle cx="62" cy="30" r="5" fill="#10B981" />
    <line x1="0" y1="60" x2="680" y2="60" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="340" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">terminal-zerodha-clone • Live Markets UI & Holdings</text>

    <!-- Watchlist Column Left -->
    <rect x="20" y="80" width="190" height="295" rx="10" fill="#FAFAFA" stroke="#E2E8F0" />
    <text x="35" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">WATCHLIST (5/50)</text>
    
    <!-- Item 1 -->
    <g transform="translate(30, 120)">
      <text x="0" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">NIFTY 50</text>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#10B981">+0.84%</text>
      <text x="160" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">24,850.20</text>
      <line x1="0" y1="38" x2="165" y2="38" stroke="#E2E8F0" />
    </g>
    <!-- Item 2 -->
    <g transform="translate(30, 170)">
      <text x="0" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">RELIANCE</text>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#10B981">+1.42%</text>
      <text x="160" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">2,980.50</text>
      <line x1="0" y1="38" x2="165" y2="38" stroke="#E2E8F0" />
    </g>
    <!-- Item 3 -->
    <g transform="translate(30, 220)">
      <text x="0" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">TCS</text>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#EF4444">-0.35%</text>
      <text x="160" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EF4444" text-anchor="end">4,120.00</text>
      <line x1="0" y1="38" x2="165" y2="38" stroke="#E2E8F0" />
    </g>
    <!-- Item 4 -->
    <g transform="translate(30, 270)">
      <text x="0" y="12" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">HDFCBANK</text>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#10B981">+0.62%</text>
      <text x="160" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">1,664.10</text>
      <line x1="0" y1="38" x2="165" y2="38" stroke="#E2E8F0" />
    </g>

    <!-- Main Chart Section -->
    <g transform="translate(230, 80)">
      <rect width="430" height="295" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Chart Header -->
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A">NIFTY 50 INDEX</text>
      <text x="145" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">LIVE +206.85 (+0.84%)</text>
      
      <rect x="330" y="12" width="40" height="24" rx="4" fill="#3B82F6" />
      <text x="350" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUY</text>
      <rect x="375" y="12" width="40" height="24" rx="4" fill="#EF4444" />
      <text x="395" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SELL</text>

      <!-- Candlesticks / Line Chart -->
      <g transform="translate(20, 70)">
        <!-- Gridlines -->
        <line x1="0" y1="40" x2="390" y2="40" stroke="#F1F5F9" />
        <line x1="0" y1="90" x2="390" y2="90" stroke="#F1F5F9" />
        <line x1="0" y1="140" x2="390" y2="140" stroke="#F1F5F9" />
        
        <!-- Candlesticks mockup -->
        <!-- Candle 1 -->
        <line x1="25" y1="110" x2="25" y2="150" stroke="#10B981" stroke-width="1.5" />
        <rect x="19" y="120" width="12" height="20" rx="2" fill="#10B981" />
        <!-- Candle 2 -->
        <line x1="65" y1="90" x2="65" y2="140" stroke="#10B981" stroke-width="1.5" />
        <rect x="59" y="98" width="12" height="25" rx="2" fill="#10B981" />
        <!-- Candle 3 -->
        <line x1="105" y1="80" x2="105" y2="130" stroke="#EF4444" stroke-width="1.5" />
        <rect x="99" y="95" width="12" height="18" rx="2" fill="#EF4444" />
        <!-- Candle 4 -->
        <line x1="145" y1="70" x2="145" y2="120" stroke="#10B981" stroke-width="1.5" />
        <rect x="139" y="75" width="12" height="30" rx="2" fill="#10B981" />
        <!-- Candle 5 -->
        <line x1="185" y1="60" x2="185" y2="100" stroke="#10B981" stroke-width="1.5" />
        <rect x="179" y="65" width="12" height="22" rx="2" fill="#10B981" />
        <!-- Candle 6 -->
        <line x1="225" y1="50" x2="225" y2="90" stroke="#EF4444" stroke-width="1.5" />
        <rect x="219" y="60" width="12" height="15" rx="2" fill="#EF4444" />
        <!-- Candle 7 -->
        <line x1="265" y1="35" x2="265" y2="80" stroke="#10B981" stroke-width="1.5" />
        <rect x="259" y="40" width="12" height="28" rx="2" fill="#10B981" />
        <!-- Candle 8 -->
        <line x1="305" y1="20" x2="305" y2="60" stroke="#10B981" stroke-width="1.5" />
        <rect x="299" y="25" width="12" height="25" rx="2" fill="#10B981" />
        <!-- Candle 9 -->
        <line x1="345" y1="15" x2="345" y2="55" stroke="#10B981" stroke-width="1.5" />
        <rect x="339" y="18" width="12" height="20" rx="2" fill="#10B981" />

        <!-- Area fill trend line -->
        <path d="M 25 130 Q 105 100 185 75 T 345 28" fill="none" stroke="#2563EB" stroke-width="2.5" />
      </g>

      <!-- Bottom Mini Stats -->
      <g transform="translate(20, 245)">
        <text x="0" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Total Portfolio</text>
        <text x="0" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">₹4,25,800</text>
        <text x="140" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Today P&amp;L</text>
        <text x="140" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#10B981">+₹14,350</text>
        <text x="280" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Invested</text>
        <text x="280" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">₹3,40,000</text>
      </g>
    </g>
  </g>
</svg>
