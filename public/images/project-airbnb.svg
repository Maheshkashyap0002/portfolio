<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <filter id="shadowAir" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgAir)" />
  
  <g transform="translate(60, 50)" filter="url(#shadowAir)">
    <rect width="680" height="400" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="30" cy="30" r="5" fill="#EF4444" />
    <circle cx="46" cy="30" r="5" fill="#F59E0B" />
    <circle cx="62" cy="30" r="5" fill="#10B981" />
    <line x1="0" y1="60" x2="680" y2="60" stroke="#F1F5F9" stroke-width="1.5" />
    <text x="340" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">stayhaven.travel • Full Stack Property & Reservation Platform</text>

    <!-- Search Pill Header -->
    <rect x="180" y="80" width="320" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadowAir)" />
    <text x="210" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Anywhere</text>
    <line x1="280" y1="90" x2="280" y2="110" stroke="#E2E8F0" />
    <text x="300" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Any week</text>
    <line x1="370" y1="90" x2="370" y2="110" stroke="#E2E8F0" />
    <text x="390" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Add guests</text>
    <circle cx="475" cy="100" r="14" fill="#FF385C" />

    <!-- Card 1 -->
    <g transform="translate(30, 140)">
      <rect width="200" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect width="200" height="130" rx="12" fill="#F1F5F9" />
      <!-- Graphic room -->
      <path d="M 30 110 L 70 70 L 130 70 L 170 110 Z" fill="#CBD5E1" />
      <rect x="75" y="55" width="50" height="45" fill="#94A3B8" />
      <text x="15" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Nordic Coastal Villa</text>
      <text x="15" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">Goa, India • Ocean View</text>
      <text x="15" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0F172A">₹6,400 <tspan font-size="10" font-weight="500" fill="#64748B">night</tspan></text>
      <text x="160" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">★ 4.96</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(240, 140)">
      <rect width="200" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect width="200" height="130" rx="12" fill="#E2E8F0" />
      <path d="M 20 120 L 100 40 L 180 120 Z" fill="#94A3B8" />
      <rect x="80" y="70" width="40" height="50" fill="#64748B" />
      <text x="15" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Modernist Pine Cabin</text>
      <text x="15" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">Manali, Himachal • Mountain</text>
      <text x="15" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0F172A">₹4,800 <tspan font-size="10" font-weight="500" fill="#64748B">night</tspan></text>
      <text x="160" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">★ 4.88</text>
    </g>

    <!-- Card 3: Checkout / Booking Overlay -->
    <g transform="translate(450, 140)">
      <rect width="200" height="230" rx="12" fill="#FAFAFA" stroke="#E2E8F0" />
      <text x="15" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Reserve Details</text>
      <rect x="15" y="45" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="25" y="65" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748B">CHECK-IN / OUT</text>
      <text x="25" y="82" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Oct 20 – Oct 25</text>
      
      <rect x="15" y="105" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="25" y="122" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748B">GUESTS</text>
      <text x="25" y="137" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">2 Guests</text>

      <rect x="15" y="160" width="170" height="42" rx="8" fill="#FF385C" />
      <text x="100" y="186" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confirm & Pay</text>
      <text x="100" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">MERN & Stripe Checkout</text>
    </g>
  </g>
</svg>
