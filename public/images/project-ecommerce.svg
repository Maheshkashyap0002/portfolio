<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F6" />
      <stop offset="100%" stop-color="#F7ECE8" />
    </linearGradient>
    <linearGradient id="accentEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB7753" />
      <stop offset="100%" stop-color="#BA3F68" />
    </linearGradient>
    <filter id="shadowEcom" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgEcom)" />

  <!-- Background Lines -->
  <g stroke="#EDDCD6" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Browser Window -->
  <g transform="translate(60, 45)" filter="url(#shadowEcom)">
    <rect width="680" height="410" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />

    <!-- Window controls -->
    <circle cx="28" cy="24" r="5" fill="#EF4444" />
    <circle cx="44" cy="24" r="5" fill="#F59E0B" />
    <circle cx="60" cy="24" r="5" fill="#10B981" />
    <line x1="0" y1="48" x2="680" y2="48" stroke="#F3F4F6" stroke-width="1.5" />
    <text x="340" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">store.fullstack-mern.internal/checkout</text>

    <!-- Store Navbar -->
    <g transform="translate(24, 60)">
      <!-- Brand -->
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111827">NOVA<tspan fill="#EB7753">STORE</tspan></text>
      
      <!-- Nav Links -->
      <text x="120" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#111827">All Products</text>
      <text x="200" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Electronics</text>
      <text x="275" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Accessories</text>

      <!-- Cart Button Badge -->
      <rect x="540" y="0" width="90" height="26" rx="13" fill="#111827" />
      <text x="568" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Cart (3)</text>
      <circle cx="616" cy="13" r="6" fill="#EB7753" />
      <text x="616" y="16" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    </g>

    <!-- Product 1 Card -->
    <g transform="translate(24, 105)">
      <rect width="190" height="235" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <!-- Product visual -->
      <rect x="12" y="12" width="166" height="110" rx="8" fill="#EEF2F6" />
      <circle cx="95" cy="67" r="30" fill="#E2E8F0" />
      <rect x="80" y="52" width="30" height="30" rx="6" fill="#CBD5E1" />
      <text x="95" y="72" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🎧</text>
      <!-- Title & Price -->
      <text x="14" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">Wireless ANC Headset</text>
      <text x="14" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Bluetooth 5.3 • Hi-Res</text>
      <text x="14" y="185" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#111827">$149.00</text>
      <text x="140" y="183" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F59E0B">★ 4.9</text>
      <!-- Add to Cart -->
      <rect x="12" y="196" width="166" height="28" rx="6" fill="url(#accentEcom)" />
      <text x="95" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Cart</text>
    </g>

    <!-- Product 2 Card -->
    <g transform="translate(228, 105)">
      <rect width="190" height="235" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" />
      <!-- Product visual -->
      <rect x="12" y="12" width="166" height="110" rx="8" fill="#F1F5F9" />
      <circle cx="95" cy="67" r="30" fill="#E2E8F0" />
      <text x="95" y="74" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⌚</text>
      <!-- Title & Price -->
      <text x="14" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#111827">OLED Smartwatch V2</text>
      <text x="14" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Heart Sensor • GPS</text>
      <text x="14" y="185" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#111827">$199.00</text>
      <text x="140" y="183" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F59E0B">★ 4.8</text>
      <!-- Add to Cart -->
      <rect x="12" y="196" width="166" height="28" rx="6" fill="#111827" />
      <text x="95" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Added to Cart ✓</text>
    </g>

    <!-- Cart & Checkout Side Panel (Right) -->
    <g transform="translate(432, 105)">
      <rect width="224" height="285" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A">ORDER SUMMARY</text>
      
      <!-- Cart Item 1 -->
      <g transform="translate(14, 38)">
        <rect width="196" height="42" rx="6" fill="#FFFFFF" stroke="#F1F5F9" />
        <rect x="8" y="7" width="28" height="28" rx="4" fill="#EEF2F6" />
        <text x="42" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1E293B">OLED Smartwatch</text>
        <text x="42" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Qty: 1 • In Stock</text>
        <text x="160" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">$199</text>
      </g>

      <!-- Cart Item 2 -->
      <g transform="translate(14, 88)">
        <rect width="196" height="42" rx="6" fill="#FFFFFF" stroke="#F1F5F9" />
        <rect x="8" y="7" width="28" height="28" rx="4" fill="#EEF2F6" />
        <text x="42" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1E293B">Mechanical Keyboard</text>
        <text x="42" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Qty: 1 • RGB Red Switch</text>
        <text x="160" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">$120</text>
      </g>

      <!-- Subtotal Calculation -->
      <line x1="14" y1="145" x2="210" y2="145" stroke="#E2E8F0" />
      <text x="16" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Subtotal</text>
      <text x="175" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">$319.00</text>
      <text x="16" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Tax (8%)</text>
      <text x="180" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">$25.52</text>
      <text x="16" y="202" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">Total</text>
      <text x="160" y="202" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#EB7753">$344.52</text>

      <!-- Stripe / Razorpay Checkout Button -->
      <rect x="14" y="218" width="196" height="34" rx="8" fill="#10B981" />
      <text x="112" y="239" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Secure Checkout (Stripe)</text>
      <text x="112" y="268" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">🔒 256-bit SSL Encrypted • JWT Auth</text>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(24, 355)">
      <rect width="394" height="35" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="22" font-family="'Courier New', monospace" font-size="10" fill="#15803D">✓ Redux Toolkit Cart State</text>
      <text x="170" y="22" font-family="'Courier New', monospace" font-size="10" fill="#2563EB">⚡ Express MongoDB REST API</text>
    </g>
  </g>
</svg>
